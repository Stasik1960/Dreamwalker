plugins { id 'fabric-loom' version '1.6.12' }

def baseline = providers.gradleProperty('baselineJar').orElse(file('baseline/mod.jar').path)
def pythonExecutable = providers.gradleProperty('pythonExecutable').orElse('python')
version = '20261104-cityeditor.2.1-cornerlight.2-rgb.2-altfix.1-cityfollowup.1'
group = 'dev.dreamwalker'
base { archivesName = 'dw-altvisual-overlay' }
layout.buildDirectory = new File(projectDir, 'build')
loom {
    splitEnvironmentSourceSets()
    mods {
        altvisual {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
    modCompileOnly files(baseline.get())
    modCompileOnly 'software.bernie.geckolib:geckolib-fabric-1.20.1:4.4.9'
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    compileOnly files(providers.gradleProperty('worldEditJar').orElse('../.local/modpacks/client-server-20261028/server_mods/worldedit-mod-7.2.15.jar'))
}
tasks.register('verifyBaseline') {
    inputs.file(baseline)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file(baseline.get()).bytes).encodeHex().toString()
        if (digest != '1f2e71c6203a9b3794d9c3cf6cf6cbe6e0a93a750584dc9df967bd2cd166e621')
            throw new GradleException('Baseline is not the pinned v22 checkpoint')
    }
}
tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyBaseline')
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
java { withSourcesJar() }

// These resources are finalized by prepareRevisionAssets after palette materialization.
def revisionProfileAsset = { profile, path ->
    file("src/main/resources/dw_city_visuals/${profile}/assets/bloodborne_dw/${path}")
}
def revisionGeneratedFiles = []
['tree_1', 'tree_2', 'tree_3'].each { name ->
    revisionGeneratedFiles.add(file("src/main/resources/dw_city_visuals/alt/assets/bloodborne_rp/geo/${name}.geo.json"))
}
revisionGeneratedFiles.add(file('src/main/resources/dw_city_visuals/alt/assets/bloodborne_rp/textures/entities/decorations/tree_3.png'))
['tree_1', 'tree_2'].each { name ->
    revisionGeneratedFiles.add(revisionProfileAsset('alt', "textures/block/remaining/source/minecraft/block/addon/${name}.png"))
}
['bricks', 'bricks_0', 'bricks_1', 'bricks_2'].each { name ->
    revisionGeneratedFiles.add(revisionProfileAsset('alt', "textures/block/autumn_c3/accent/base_${name}.png"))
    revisionGeneratedFiles.add(revisionProfileAsset('alt', "textures/block/remaining/source/minecraft/block/${name}.png"))
    revisionGeneratedFiles.add(revisionProfileAsset('alt', "textures/block/autumn_c3/accent/red_${name}.png"))
}
[
    'textures/block/remaining/source/minecraft/block/addon/roof_1.png',
    'textures/block/autumn_c3/window_surround.png',
    'textures/block/autumn_c3/accent/brick_window_surround.png',
    'textures/block/autumn_c3/accent/window_surround.png',
    'textures/block/autumn_c3/accent/base_window_surround.png',
    'textures/block/autumn_c3/accent/brick_wall_0010.png'
].each { path -> revisionGeneratedFiles.add(revisionProfileAsset('alt', path)) }
['original', 'alt'].each { profile ->
    revisionGeneratedFiles.add(revisionProfileAsset(profile, 'textures/block/remaining/source/minecraft/block/addon/spirelamp_0018.png'))
    revisionGeneratedFiles.add(revisionProfileAsset(profile, 'models/remaining/source/minecraft/block/addon/gray_glazed_terracotta_0.json'))
}
revisionGeneratedFiles.add(file('src/main/resources/assets/bloodborne_dw/visuals/contextual-masonry.json'))

// The source archive contains one generated sprite. Update that entry before the
// palette compiler snapshots the archive, so consecutive builds stay incremental.
tasks.register('prepareSpritePaletteArchive', Exec) {
    inputs.files('tools/tree-sprite-inputs.zip', 'tools/repair_sprite_tree.py')
    inputs.property('pythonExecutable', pythonExecutable)
    outputs.file('tools/v12-palette-inputs.zip')
    outputs.doNotCacheIf('The archive also contains manually maintained source entries') { true }
    commandLine pythonExecutable.get(), file('tools/repair_sprite_tree.py').path, '--archive-only'
}

// Compile small ALT texture assets once at build time from immutable source pixels.
tasks.register('materializeV12Palettes', Exec) {
    dependsOn tasks.named('verifyBaseline'), tasks.named('prepareSpritePaletteArchive')
    inputs.files('tools/MaterializeV12Palettes.java', 'tools/v12-baked-palettes.json', 'tools/v12-palette-inputs.zip', 'tools/family-baked-palettes.json')
    inputs.file(baseline)
    outputs.files(providers.provider {
        def rules = new groovy.json.JsonSlurper().parse(file('tools/v12-baked-palettes.json'))
        def images = rules.sprites.collect { rule ->
            file('src/main/resources/dw_city_visuals/alt/assets/' + rule.sprite.replace(':', '/textures/') + '.png')
        }
        def family = new groovy.json.JsonSlurper().parse(file('tools/family-baked-palettes.json'))
        family.sprites.each { rule ->
            ['original', 'alt'].each { mode ->
                if (rule[mode] || rule.regions?.any { it[mode] })
                    images.add(file('src/main/resources/dw_city_visuals/' + mode + '/assets/' + rule.sprite.replace(':', '/textures/') + '.png'))
            }
        }
        images.unique().findAll { !revisionGeneratedFiles.contains(it) }
    })
    outputs.file('build/reports/v12-palette-assets.json')
    doFirst {
        def gson = sourceSets.client.compileClasspath.files.find { it.name.startsWith('gson-') && it.name.endsWith('.jar') }
        if (gson == null) throw new GradleException('Missing Gson for palette asset compiler')
        commandLine new File(System.getProperty('java.home'), 'bin/java.exe').path,
            '--class-path', gson.path,
            file('tools/MaterializeV12Palettes.java').path,
            '--base', baseline.get(), '--resources', file('src/main/resources').path,
            '--rules', file('tools/v12-baked-palettes.json').path,
            '--family', file('tools/family-baked-palettes.json').path,
            '--inputs', file('tools/v12-palette-inputs.zip').path,
            '--receipt', file('build/reports/v12-palette-assets.json').path
    }
}

tasks.register('generateEditor2Palette', Exec) {
    dependsOn tasks.named('prepareRevisionAssets')
    inputs.files('tools/editor2-palette-inputs/classification.json', 'tools/editor2-palette-inputs/inventory.json', 'tools/editor2-palette-inputs/sources.zip')
    inputs.files(fileTree('tools/editor2-palette-inputs/masks'))
    inputs.file('tools/generate_editor2_palette.py')
    outputs.file('src/main/resources/dw_city_visuals/alt/assets/bloodborne_dw/visuals/editor2-palette.json')
    outputs.dir('src/main/resources/dw_city_visuals/alt/assets/bloodborne_dw/textures/block/editor2_palette')
    commandLine pythonExecutable.get(), file('tools/generate_editor2_palette.py').path
}

tasks.register('generateRgbPhase1', Exec) {
    dependsOn tasks.named('generateEditor2Palette')
    inputs.file(baseline)
    inputs.files('tools/generate_rgb_phase1.py', 'tools/rgb_catalogue.py', 'tools/rgb_native_catalogue.py',
        'tools/rgb-catalogue-input.json', 'tools/rgb-material-keep.json')
    inputs.files(fileTree('tools/editor2-palette-inputs/masks'))
    inputs.files('tools/editor2-palette-inputs/classification.json', 'tools/editor2-palette-inputs/masks/024.png',
        'src/main/resources/assets/bloodborne_dw/visuals/facades.json')
    inputs.files(fileTree('src/main/resources/dw_city_visuals/alt') { exclude '**/editor2_rgb/**' })
    outputs.file('src/main/resources/bloodborne_dw/rgb-phase1.json')
    outputs.dir('src/main/resources/dw_city_visuals/alt/assets/bloodborne_dw/textures/block/editor2_rgb')
    commandLine pythonExecutable.get(), file('tools/generate_rgb_phase1.py').path, '--baseline', baseline.get()
}

tasks.register('generateEditor2NativeFlags', Exec) {
    dependsOn tasks.named('verifyBaseline')
    inputs.file(baseline)
    inputs.files(fileTree('tools/editor2-palette-inputs'))
    inputs.files('tools/generate_editor2_native_flags.py', 'src/main/resources/assets/bloodborne_dw/visuals/facades.json')
    outputs.file('src/main/resources/bloodborne_dw/editor2-native-flags.bin')
    commandLine pythonExecutable.get(), file('tools/generate_editor2_native_flags.py').path, baseline.get()
}
tasks.register('generateEditor2PoseFlags', Exec) {
    inputs.files(fileTree('tools/editor2-palette-inputs'))
    inputs.files('tools/generate_editor2_pose_flags.py', 'src/main/resources/assets/bloodborne_dw/visuals/facades.json')
    outputs.files('src/main/resources/bloodborne_dw/editor2-pose-flags.json', 'src/main/resources/bloodborne_dw/editor2-fallback-flags.bin', 'src/main/resources/bloodborne_dw/editor2-wall-flags.bin')
    commandLine pythonExecutable.get(), file('tools/generate_editor2_pose_flags.py').path
}

tasks.register('generateEditor2SlabFlags', Exec) {
    inputs.files('tools/editor2-palette-inputs/classification.json', 'tools/editor2-palette-inputs/slab-sprites.json', 'tools/generate_editor2_slab_flags.py', 'src/main/resources/assets/bloodborne_dw/visuals/facades.json')
    outputs.file('src/main/resources/bloodborne_dw/editor2-slab-flags.json')

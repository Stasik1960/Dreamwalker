tasks.register('generateVisualResourceIndex', Exec) {
    dependsOn tasks.named('generateEditor2Palette'), tasks.named('generateRgbPhase1')
    inputs.files(fileTree('src/main/resources/dw_city_visuals'))
    inputs.file('tools/prepare_resource_index.py')
    outputs.file('src/main/resources/assets/bloodborne_dw/visuals/resource-index.json')
    commandLine pythonExecutable.get(),
        file('tools/prepare_resource_index.py').path
}

// Keep the handshake identity in sync without hashing resources on either game thread.
tasks.register('generateVisualFingerprints', Exec) {
    dependsOn tasks.named('generateVisualResourceIndex'), tasks.named('generateEditor2NativeFlags'), tasks.named('generateEditor2PoseFlags'), tasks.named('generateEditor2SlabFlags')
    inputs.files(fileTree('src/main/java') { include '**/*.java' }, fileTree('src/client/java') { include '**/*.java' })
    inputs.files(fileTree('src/main/resources') { exclude '**/profile-fingerprints.json' })
    inputs.file('tools/prepare_visual_fingerprints.py')
    outputs.file('src/main/resources/assets/bloodborne_dw/visuals/profile-fingerprints.json')
    commandLine pythonExecutable.get(),
        file('tools/prepare_visual_fingerprints.py').path
}
tasks.named('processResources') { dependsOn tasks.named('generateVisualFingerprints') }

tasks.register('prepareRevisionAssets', Exec) {
    dependsOn tasks.named('materializeV12Palettes')
    inputs.files(
        'tools/prepare_revision_assets.py', 'tools/import_tree_project.py',
        'tools/repair_sprite_tree.py', 'tools/repair_facade_assets.py',
        'inputs/trees/DreamWalker-trees.dwtree.json', 'tools/tree-sprite-inputs.zip',
        'tools/facade-inputs.zip', 'tools/v12-baked-palettes.json', 'baseline/mod.jar'
    )
    inputs.property('pythonExecutable', pythonExecutable)
    outputs.files(revisionGeneratedFiles)
    outputs.files('validation/tree-import-v7.json',
        'validation/sprite-tree-v7.json', 'validation/facade-v7-assets.json')
    commandLine pythonExecutable.get(), file('tools/prepare_revision_assets.py').path
}


plugins { id 'fabric-loom' version '1.6.12' }

def workspace = file('D:/DreamWalker')
def baseline = providers.gradleProperty('baselineJar').orElse(new File(workspace,
    '.local/dw-fix-20261028/checkpoints/test-launch-microstutter-v22-20261029/mod.jar').path)
version = '20261101-altvisual.6'
group = 'dev.dreamwalker'
base { archivesName = 'dw-altvisual-overlay' }
layout.buildDirectory = new File(projectDir, 'build')
loom {
    splitEnvironmentSourceSets()
    mods {
        altvisual {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
    modCompileOnly files(baseline.get())
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.4.1'
}
tasks.register('verifyBaseline') {
    inputs.file(baseline)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file(baseline.get()).bytes).encodeHex().toString()
        if (digest != '1f2e71c6203a9b3794d9c3cf6cf6cbe6e0a93a750584dc9df967bd2cd166e621')
            throw new GradleException('Baseline is not the pinned v22 checkpoint')
    }
}
tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyBaseline')
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
java { withSourcesJar() }

// Compile small ALT texture assets once at build time from immutable source pixels.
tasks.register('materializeV12Palettes', Exec) {
    dependsOn tasks.named('verifyBaseline')
    inputs.files('tools/MaterializeV12Palettes.java', 'tools/v12-baked-palettes.json', 'tools/v12-palette-inputs.zip', 'tools/family-baked-palettes.json')
    inputs.file(baseline)
    outputs.files(providers.provider {
        def rules = new groovy.json.JsonSlurper().parse(file('tools/v12-baked-palettes.json'))
        def images = rules.sprites.collect { rule ->
            file('src/main/resources/dw_city_visuals/alt/assets/' + rule.sprite.replace(':', '/textures/') + '.png')
        }
        def family = new groovy.json.JsonSlurper().parse(file('tools/family-baked-palettes.json'))
        family.sprites.each { rule ->
            ['original', 'alt'].each { mode ->
                if (rule[mode] || rule.regions?.any { it[mode] })
                    images.add(file('src/main/resources/dw_city_visuals/' + mode + '/assets/' + rule.sprite.replace(':', '/textures/') + '.png'))
            }
        }
        images.unique()
    })
    outputs.file('build/reports/v12-palette-assets.json')
    doFirst {
        def gson = sourceSets.client.compileClasspath.files.find { it.name.startsWith('gson-') && it.name.endsWith('.jar') }
        if (gson == null) throw new GradleException('Missing Gson for palette asset compiler')
        commandLine new File(System.getProperty('java.home'), 'bin/java.exe').path,
            '--class-path', gson.path,
            file('tools/MaterializeV12Palettes.java').path,
            '--base', baseline.get(), '--resources', file('src/main/resources').path,
            '--rules', file('tools/v12-baked-palettes.json').path,
            '--family', file('tools/family-baked-palettes.json').path,
            '--inputs', file('tools/v12-palette-inputs.zip').path,
            '--receipt', file('build/reports/v12-palette-assets.json').path
    }
}

tasks.register('generateVisualResourceIndex', Exec) {
    dependsOn tasks.named('materializeV12Palettes')
    inputs.files(fileTree('src/main/resources/dw_city_visuals'))
    inputs.file('tools/prepare_resource_index.py')
    outputs.file('src/main/resources/assets/bloodborne_dw/visuals/resource-index.json')
    commandLine new File(workspace, '.local/venv/Scripts/python.exe').path,
        file('tools/prepare_resource_index.py').path
}

// Keep the handshake identity in sync without hashing resources on either game thread.
tasks.register('generateVisualFingerprints', Exec) {
    dependsOn tasks.named('generateVisualResourceIndex')
    inputs.files(fileTree('src') { exclude '**/profile-fingerprints.json' })
    inputs.file('tools/prepare_visual_fingerprints.py')
    outputs.file('src/main/resources/assets/bloodborne_dw/visuals/profile-fingerprints.json')
    commandLine new File(workspace, '.local/venv/Scripts/python.exe').path,
        file('tools/prepare_visual_fingerprints.py').path
}
tasks.named('processResources') { dependsOn tasks.named('generateVisualFingerprints') }

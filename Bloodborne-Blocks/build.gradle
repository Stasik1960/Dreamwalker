plugins { id 'fabric-loom' version '1.6.12'; id 'maven-publish' }
version = '1.2.0'
group = 'dev.dreamwalker'
base { archivesName = 'bloodborne-blocks' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { withSourcesJar() }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('geometryCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.GeometryChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
}
tasks.named('check') { dependsOn 'geometryCheck' }

plugins { id 'fabric-loom' version '1.6.12'; id 'maven-publish' }
version = '2.1.0-alpha.1'
group = 'dev.dreamwalker'
base { archivesName = 'bloodborne-blocks' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { withSourcesJar() }
sourceSets {
 gametest {
  compileClasspath += sourceSets.main.output
  runtimeClasspath += sourceSets.main.output
  compileClasspath += sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.runtimeClasspath
 }
}
configurations {
 gametestImplementation.extendsFrom implementation
 gametestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
 mods {
  bloodborne_blocks_gametest {
   sourceSet sourceSets.gametest
  }
 }
 runs {
  gametest {
   inherit server
   name 'Logical GameTest Server'
   source sourceSets.gametest
   runDir 'build/gametest'
   vmArg '-Xmx2G'
   vmArg '-Dfabric-api.gametest'
   vmArg "-Dfabric-api.gametest.report-file=${file('build/test-results/gametest/TEST-logical-gametest.xml').absolutePath}"
  }
 }
}
// Generated art is already shipped in the runtime JAR and in the repository.
// Remapping hundreds of thousands of resource entries in a source archive adds
// no source information and makes the normal build unnecessarily expensive.
tasks.named('sourcesJar') { exclude 'assets/**', 'data/**', 'bloodborne_blocks/**' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
// The modular palette exceeds the classic ZIP entry-count limit.
tasks.withType(Zip).configureEach { zip64 = true }
tasks.register('geometryCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.GeometryChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
}
tasks.register('modularDataCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.ModularDataChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '2G'
}
tasks.register('logicalObjectCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.LogicalObjectChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
}
tasks.register('logicalRegistryCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.LogicalRegistryChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
}
tasks.register('logicalContractV2Check', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.LogicalContractV2Checks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
}
tasks.register('logicalGameTest') {
 group = 'verification'
 description = 'Runs server-side logical-object GameTests in build/gametest.'
 dependsOn 'runGametest'
}

tasks.register('logicalVisualModelsCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
 mainClass = 'dev.dreamwalker.bloodborneblocks.BootstrapCheckLauncher'
 args 'dev.dreamwalker.bloodborneblocks.LogicalVisualModelsChecks'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
 maxHeapSize = '1G'
 if (project.hasProperty('altStarterKitZip')) systemProperty 'bloodborne.altStarterKitZip', project.file(project.property('altStarterKitZip')).absolutePath
}
tasks.named('check') { dependsOn 'logicalVisualModelsCheck' }
tasks.named('check') { dependsOn 'geometryCheck', 'modularDataCheck', 'logicalObjectCheck', 'logicalRegistryCheck', 'logicalContractV2Check' }

// All present/future Contract V2 output passes the same offline support gate.
// Runtime consumes precomputed transforms/shapes; no tick/frame mesh analysis.
tasks.register('normalizeSupportContracts', Exec) {
 group = 'verification'
 commandLine providers.gradleProperty('bloodbornePython').getOrElse('python'), '-B', '-X', 'utf8',
  'tools/normalize_support_contracts.py'
}
tasks.named('processResources') { dependsOn 'normalizeSupportContracts' }
tasks.named('check') { dependsOn 'normalizeSupportContracts' }
tasks.withType(JavaExec).configureEach { dependsOn 'normalizeSupportContracts' }

// Override with -PbloodbornePython=/path/to/python when Python is not on PATH.
// These tests need numpy (same dependency as the existing world converter).
// Historical Nightmare/QA2 compiler checks intentionally do not run against
// the pruned live palette. Their inputs remain frozen in production-authoring
// evidence; these tasks cover current production behavior and generic safety.
['test_region_padding', 'test_logical_world', 'test_source_review_decisions', 'test_source_variant_rng',
 'test_fixture_level_metadata', 'test_split_transactions', 'test_visual_slots', 'test_support_collision', 'check_contract_orientation',
 'test_build_nightmare_contracts', 'test_nightmare_geometry_recipes', 'test_nightmare_functional_recipes',
 'test_nightmare_composition_recipes', 'test_export_alt_visual_starter', 'test_support_normalization',
 'check_logical_resources', 'test_production_door', 'test_production_inventory', 'test_production_geometry',
 'test_production_gallery', 'test_build_production_gallery', 'test_production_palette',
 'test_restore_functional', 'test_restore_c003', 'test_restored_migration', 'test_preserved_semantics', 'test_production_coverage', 'production_coverage',
 'test_production_fingerprints', 'test_production_exact_duplicates', 'test_agony_patch'].each { testName ->
 tasks.register(testName, Exec) {
  group = 'verification'
  dependsOn 'normalizeSupportContracts'
  commandLine providers.gradleProperty('bloodbornePython').getOrElse('python'), '-B', '-X', 'utf8', "tools/${testName}.py"
 }
 tasks.named('check') { dependsOn testName }
}

// Checkpoint proof cannot be produced by merely re-reading a stale test XML.
// No gallery is overwritten; generate a fresh gallery before this task.
tasks.register('qa2BuildProof', Exec) {
 dependsOn 'check', 'logicalGameTest', 'remapJar'
 commandLine providers.gradleProperty('bloodbornePython').getOrElse('python'), '-B', '-X', 'utf8',
  'tools/verify_qa2_checkpoint.py', '--record-build-proof'
}
tasks.register('qa2Checkpoint', Exec) {
 group = 'verification'
 dependsOn 'qa2BuildProof'
 commandLine providers.gradleProperty('bloodbornePython').getOrElse('python'), '-B', '-X', 'utf8',
  'tools/verify_qa2_checkpoint.py', '--report', providers.gradleProperty('qa2Report').getOrElse('build/qa2-checkpoint.json')
}

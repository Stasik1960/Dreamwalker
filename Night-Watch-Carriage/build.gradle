plugins {
    id 'fabric-loom' version '1.10.5'
}

group = 'dev.nightwatch'
version = '0.1.3'
base { archivesName = 'night-watch-carriage-fabric-1.20.1' }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1'
    if (providers.gradleProperty('qaDynamicLights').isPresent()) {
        modLocalRuntime files(providers.gradleProperty('qaDynamicLights').get().split(File.pathSeparator))
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    clienttest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        nightwatchcarriage { sourceSet sourceSets.main }
        nightwatchcarriage_tests { sourceSet sourceSets.gametest }
        nightwatchcarriage_clienttest { sourceSet sourceSets.clienttest }
    }
    runs {
        gametest {
            inherit server
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
        }
        clientSmoke {
            inherit client
            source sourceSets.clienttest
            runDir 'build/client-smoke'
            programArgs '--width', '1100', '--height', '690'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

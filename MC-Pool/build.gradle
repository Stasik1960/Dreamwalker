plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Deterministic physics scenarios without an extra test framework dependency.
tasks.register('physicsCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.coraxberg.poolbilliards.game.PoolPhysicsCheck'
}

tasks.named('check') {
    dependsOn 'physicsCheck'
    dependsOn 'layoutCheck'
}

tasks.register('layoutCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coraxberg.poolbilliards.client.PoolLayoutCheck'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

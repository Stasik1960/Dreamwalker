plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("com.coraxberg:rp-chat:${project.rpchat_version}") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Fast executable contract checks for the radio model and responsive screen layout.
tasks.register('radioContractCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coraxberg.dwmagicconnect.item.RadioContractCheck'
}

tasks.register('networkContractCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coraxberg.dwmagicconnect.network.NetworkContractCheck'
}

tasks.register('relayContractCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coraxberg.dwmagicconnect.radio.RelayContractCheck'
}

tasks.named('check') {
    dependsOn tasks.named('radioContractCheck')
    dependsOn tasks.named('networkContractCheck')
    dependsOn tasks.named('relayContractCheck')
}

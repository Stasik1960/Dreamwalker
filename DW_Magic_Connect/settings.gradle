pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

includeBuild('../RP-Chat') {
    dependencySubstitution {
        substitute module('com.coraxberg:rp-chat') using project(':')
    }
}

rootProject.name = 'dw-magic-connect-fabric-1.20.1'

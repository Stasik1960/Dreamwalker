name: Magic Connect build
on:
  push:
    paths:
      - 'DW_Magic_Connect/**'
      - 'RP-Chat/**'
      - '.github/workflows/magic-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build RP Chat dependency
        working-directory: RP-Chat
        run: gradle build --no-daemon
      - name: Build and check clock radio
        working-directory: DW_Magic_Connect
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dw-magic-connect-0.3.0
          path: DW_Magic_Connect/build/libs/dw-magic-connect-0.3.0.jar
          if-no-files-found: error

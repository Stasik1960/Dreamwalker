name: Model Props build

on:
  push:
    paths:
      - 'Model-Props/**'
      - 'releases/Model-Props/**'
      - '.github/workflows/model-props.yml'
  pull_request:
    paths:
      - 'Model-Props/**'
      - 'releases/Model-Props/**'
      - '.github/workflows/model-props.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check Model Props
        working-directory: Model-Props
        run: |
          chmod +x gradlew
          ./gradlew clean check build --no-daemon --stacktrace
      - name: Verify creative-tab remap regression
        working-directory: Model-Props
        shell: bash
        run: |
          jar_path='build/libs/modelprops-fabric-1.20.1-1.3.1.jar'
          javap -classpath "$jar_path" -c -p ru.modelprops.client.ModelPropsClient > build/modelprops-client.javap.txt
          grep -Fq 'net/minecraft/class_1761$class_7704.method_45420' build/modelprops-client.javap.txt
          if grep -Fq 'FabricItemGroupEntries.add' build/modelprops-client.javap.txt; then
            echo 'Found the broken 1.3.0 creative-tab call after remap.' >&2
            exit 1
          fi
      - name: Verify published checksum
        shell: bash
        run: cd releases/Model-Props && sha256sum -c modelprops-fabric-1.20.1-1.3.1.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: modelprops-fabric-1.20.1-1.3.1
          path: |
            Model-Props/build/libs/modelprops-fabric-1.20.1-1.3.1.jar
            Model-Props/build/libs/modelprops-fabric-1.20.1-1.3.1-sources.jar
          if-no-files-found: error

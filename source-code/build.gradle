plugins { id 'fabric-loom' version '1.6.12'; id 'maven-publish' }
version = providers.gradleProperty('mod_version').get()
layout.buildDirectory = file(providers.gradleProperty('native_visual_build_dir').orElse('build-native-visual').get())
group = 'dev.dreamwalker'
base { archivesName = 'dreamwalker-bb-fabric-1.20.1' }
repositories {
 mavenCentral()
 maven { url = 'https://maven.enginehub.org/repo/' }
 maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
 include(implementation(annotationProcessor('io.github.llamalad7:mixinextras-fabric:0.5.0')))
 if (providers.gradleProperty('worldedit_api_jar').isPresent()) {
  compileOnly files(providers.gradleProperty('worldedit_api_jar').get())
 } else { compileOnly 'com.sk89q.worldedit:worldedit-core:7.2.15' }
 if (providers.gradleProperty('worldedit_qa').orNull == 'true') {
  modRuntimeOnly files('build/v127-dependencies/worldedit-mod-7.2.15.jar')
 }
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1'
 modImplementation 'software.bernie.geckolib:geckolib-fabric-1.20.1:4.4.9'
 implementation 'com.eliotlash.mclib:mclib:20'
}
sourceSets {
 restorationqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 faerieqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 utilityqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 benchqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 fixqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 nativegridqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 routeqa {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 nativegridrelight {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 nativegridexport {
  compileClasspath += sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.runtimeClasspath
  if (providers.gradleProperty('native_grid_export_baseline_classes').isPresent()) {
   compileClasspath += files(providers.gradleProperty('native_grid_export_baseline_classes').get())
  } else {
   compileClasspath += sourceSets.main.output
   runtimeClasspath += sourceSets.main.output
  }
 }
 main {
  java.srcDirs = ['src/architecture/java', 'src/rp/java']
  // Match the active source scope of the published .6 JAR. Historical files
  // remain in Git, but reference APIs removed before that checkpoint.
  file('tools/static-city-20261017/production-source-excludes.txt').readLines('UTF-8').findAll { it && !it.startsWith('#') }.each { java.exclude it }
  resources.srcDirs = ['src/architecture/resources']
  resources.exclude 'assets/bloodborne_dw/blockstates/native_grid_*.json', 'assets/bloodborne_dw/models/block/native_grid_*.json', 'assets/bloodborne_dw/models/item/native_grid_*.json'
 }
 test {
  java.srcDirs = ['src/test/java']
  // This historical tool is outside the frozen production source scope above.
  java.exclude 'dev/dreamwalker/bloodbornedw/tool/BuilderUndoChecks.java'
 }
 gametest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 gallery {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
configurations {
 restorationqaImplementation.extendsFrom implementation
 restorationqaRuntimeOnly.extendsFrom runtimeOnly
 faerieqaImplementation.extendsFrom implementation
 faerieqaRuntimeOnly.extendsFrom runtimeOnly
 utilityqaImplementation.extendsFrom implementation
 utilityqaRuntimeOnly.extendsFrom runtimeOnly
 benchqaImplementation.extendsFrom implementation
 benchqaRuntimeOnly.extendsFrom runtimeOnly
 fixqaImplementation.extendsFrom implementation
 fixqaRuntimeOnly.extendsFrom runtimeOnly
 nativegridqaImplementation.extendsFrom implementation
 nativegridqaRuntimeOnly.extendsFrom runtimeOnly
 routeqaImplementation.extendsFrom implementation
 routeqaRuntimeOnly.extendsFrom runtimeOnly
 nativegridrelightImplementation.extendsFrom implementation
 nativegridrelightRuntimeOnly.extendsFrom runtimeOnly
 nativegridexportImplementation.extendsFrom implementation
 nativegridexportRuntimeOnly.extendsFrom runtimeOnly
 gametestImplementation.extendsFrom implementation
 gametestRuntimeOnly.extendsFrom runtimeOnly
 galleryImplementation.extendsFrom implementation
 galleryRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('fixQaJar', Jar) {
 dependsOn fixqaClasses
 from sourceSets.fixqa.output
 archiveBaseName = 'dreamwalker-fix-qa'
 archiveClassifier = 'dev'
}
tasks.register('restorationQaJar', Jar) {
 dependsOn restorationqaClasses
 from sourceSets.restorationqa.output
 archiveBaseName = 'dreamwalker-restoration-qa'
 archiveClassifier = 'dev'
}
tasks.register('remapRestorationQaJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn restorationQaJar
 inputFile.set(tasks.named('restorationQaJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.restorationqa.compileClasspath)
 archiveBaseName = 'dreamwalker-restoration-qa'
 archiveClassifier = ''
 addNestedDependencies = false
}
tasks.register('restorationBuild') { dependsOn remapJar, remapRestorationQaJar }
tasks.register('remapFixQaJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn fixQaJar
 inputFile.set(tasks.named('fixQaJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.fixqa.compileClasspath)
 archiveBaseName = 'dreamwalker-fix-qa'
 archiveClassifier = ''
 addNestedDependencies = false
}
tasks.register('benchQaJar', Jar) {
 dependsOn benchqaClasses
 from sourceSets.benchqa.output
 archiveBaseName = 'dreamwalker-bench-qa'
 archiveClassifier = 'dev'
}
tasks.register('utilityQaJar', Jar) {
 dependsOn utilityqaClasses
 from sourceSets.utilityqa.output
 archiveBaseName = 'dreamwalker-utility-qa'
 archiveClassifier = 'dev'
}
tasks.register('faerieQaJar', Jar) {
 dependsOn faerieqaClasses
 from sourceSets.faerieqa.output
 archiveBaseName = 'dreamwalker-faerie-qa'
 archiveClassifier = 'dev'
}
tasks.register('remapFaerieQaJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn faerieQaJar
 inputFile.set(tasks.named('faerieQaJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.faerieqa.compileClasspath)
 archiveBaseName = 'dreamwalker-faerie-qa'
 archiveClassifier = ''
 addNestedDependencies = false
}
tasks.register('remapUtilityQaJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn utilityQaJar
 inputFile.set(tasks.named('utilityQaJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.utilityqa.compileClasspath)
 archiveBaseName = 'dreamwalker-utility-qa'
 archiveClassifier = ''
 addNestedDependencies = false
}
tasks.register('remapBenchQaJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn benchQaJar
 inputFile.set(tasks.named('benchQaJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.benchqa.compileClasspath)
 archiveBaseName = 'dreamwalker-bench-qa'
 archiveClassifier = ''
 addNestedDependencies = false
}
['RouteQa':'routeqa', 'NativeGridRelight':'nativegridrelight', 'NativeGridQa':'nativegridqa'].each { label, sources ->
 tasks.register(label.uncapitalize() + 'Jar', Jar) {
  dependsOn tasks.named(sources + 'Classes')
  from sourceSets[sources].output
  archiveBaseName = label == 'RouteQa' ? 'dreamwalker-native-route-qa' : label == 'NativeGridQa' ? 'dreamwalker-native-grid-qa' : 'dreamwalker-native-grid-relight'
  archiveClassifier = 'dev'
 }
 tasks.register('remap' + label + 'Jar', net.fabricmc.loom.task.RemapJarTask) {
  dependsOn tasks.named(label.uncapitalize() + 'Jar')
  inputFile.set(tasks.named(label.uncapitalize() + 'Jar', Jar).flatMap { it.archiveFile })
  classpath.from(sourceSets[sources].compileClasspath)
  archiveBaseName = label == 'RouteQa' ? 'dreamwalker-native-route-qa' : label == 'NativeGridQa' ? 'dreamwalker-native-grid-qa' : 'dreamwalker-native-grid-relight'
  archiveClassifier = ''
  addNestedDependencies = false
 }
}
tasks.register('nativeGridExportJar', Jar) {
 dependsOn nativegridexportClasses
 from sourceSets.nativegridexport.output
 archiveBaseName = 'dreamwalker-native-grid-export'
 archiveClassifier = 'dev'
}
tasks.register('remapNativeGridExportJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn nativeGridExportJar
 inputFile.set(tasks.named('nativeGridExportJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.nativegridexport.compileClasspath)
 archiveBaseName = 'dreamwalker-native-grid-export'
 archiveClassifier = ''
 addNestedDependencies = false
}
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { withSourcesJar() }
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand 'version': project.version }
 from('src/rp/resources') { exclude 'fabric.mod.json' }
 from('src/nativevisual/resources')
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('transactionCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.dreamwalker.bloodbornedw.runtime.TransactionChecks'
}
tasks.named('check') { dependsOn 'transactionCheck' }
loom {
 accessWidenerPath = file('src/architecture/resources/native-visual.accesswidener')
 mods { bloodborne_dw_gametest { sourceSet sourceSets.gametest } }
 runs {
  client { runDir 'build/run-client'; vmArg '-Xmx3G' }
  server { runDir 'build/run-server'; vmArg '-Xmx2G' }
  gametest {
   inherit server
   name 'Dreamwalker first-set technical GameTests'
   source sourceSets.gametest
   runDir "build/gametest-${findProperty('gametest_run_name') ?: 'first-set'}"
   vmArg '-Xmx' + (findProperty('gametest_heap_gb') ?: '2') + 'G'
   if (findProperty('gametest_processor_count')) vmArg '-XX:ActiveProcessorCount=' + findProperty('gametest_processor_count')
   vmArg '-XX:+HeapDumpOnOutOfMemoryError'
   vmArg '-XX:HeapDumpPath=' + file('build/v127-validation/' + (findProperty('gametest_run_name') ?: 'first-set') + '/oom.hprof').absolutePath
   vmArg '-Dfabric-api.gametest'
   vmArg "-Dfabric-api.gametest.report-file=${file('build/test-results/gametest/TEST-' + (findProperty('gametest_run_name') ?: 'first-set') + '.xml').absolutePath}"
  }
 }
}
tasks.register('ladderGameTest') { group = 'verification'; dependsOn 'runGametest' }
tasks.register('firstSetGameTest') { group = 'verification'; dependsOn 'runGametest' }
tasks.register('galleryJar', Jar) {
 dependsOn galleryClasses
 from sourceSets.gallery.output
 archiveBaseName = 'dreamwalker-gallery-author'
 archiveClassifier = 'dev'
}
tasks.register('remapGalleryJar', net.fabricmc.loom.task.RemapJarTask) {
 dependsOn galleryJar
 inputFile.set(tasks.named('galleryJar', Jar).flatMap { it.archiveFile })
 classpath.from(sourceSets.main.output, sourceSets.main.compileClasspath)
 archiveBaseName = 'dreamwalker-gallery-author'
 archiveClassifier = ''
 addNestedDependencies = false
}

tasks.withType(AbstractCopyTask).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

// The city DH experiment is a separate opt-in artifact. Normal builds neither
// resolve DH nor link its API from the production mod.
if (providers.gradleProperty('dh_pilot_jar').isPresent()) {
 sourceSets {
  dhpilot {
   compileClasspath += sourceSets.main.compileClasspath + files(providers.gradleProperty('dh_pilot_jar').get())
  }
 }
 configurations.dhpilotImplementation.extendsFrom configurations.implementation
 processDhpilotResources { filesMatching('fabric.mod.json') { expand 'version': project.version } }
 tasks.register('dhPilotJar', Jar) {
  dependsOn dhpilotClasses
  from sourceSets.dhpilot.output
  archiveBaseName = 'dreamwalker-dh-city-pilot'
  archiveClassifier = 'dev'
 }
 tasks.register('remapDhPilotJar', net.fabricmc.loom.task.RemapJarTask) {
  dependsOn dhPilotJar
  inputFile.set(tasks.named('dhPilotJar', Jar).flatMap { it.archiveFile })
  classpath.from(sourceSets.dhpilot.compileClasspath)
  archiveBaseName = 'dreamwalker-dh-city-pilot'
  archiveClassifier = ''
  addNestedDependencies = false
 }
}

// The full city catalogue exceeds the classic ZIP entry limit.
tasks.withType(Jar).configureEach { zip64 = true }
